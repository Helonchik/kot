<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Discord Role Manager Pro{% endblock %}</title>
    
    <!-- Tailwind CSS (via CDN for simplicity in this setup, normally bundled) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        discord: '#5865F2',
                        discordHover: '#4752C4',
                        dark: '#1e1f22',
                        darker: '#111214',
                        darkest: '#000000',
                    }
                }
            }
        }
    </script>
    
    <!-- AlpineJS for micro-interactions -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    
    <!-- HTMX for dynamic content -->
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>
        .glass {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        body {
            background: radial-gradient(circle at top left, #2f3136, #111214);
            min-height: 100vh;
        }
    </style>
    {% block head %}{% endblock %}
</head>
<body class="text-gray-100 font-sans antialiased overflow-x-hidden">
    
    {% block layout %}{% endblock %}

</body>
</html>
